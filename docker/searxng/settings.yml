# Configuración exclusiva para la instancia local del radar.
use_default_settings:
  engines:
    # Motores web comprobados desde esta conexión. Los motores predeterminados
    # devolvían CAPTCHA/429 y Wikipedia no admite búsquedas por sitio.
    keep_only:
      - yandex
      - bing

server:
  # No es una clave de cuenta ni API; protege las cookies de esta instancia.
  secret_key: "pcmidi-local-searxng-9d03d043c10a4a0d9e1e60f6"
  image_proxy: true
  # El radar llama desde localhost, sin proxy inverso que aporte la IP.
  limiter: false

search:
  formats:
    - html
    - json

outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0

engines:
  - name: yandex
    disabled: false
    timeout: 8.0
  - name: bing
    disabled: false
    timeout: 8.0
